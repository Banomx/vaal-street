name: Build & deploy to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: "10 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm test

  snapshots:
    name: Snapshot ${{ matrix.game }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        game: [poe1, poe2]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Restore saved history
        uses: actions/cache/restore@v4
        with:
          path: .market-recovery
          key: market-history-v1-${{ matrix.game }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: market-history-v1-${{ matrix.game }}-
      - name: Recover deployed and checked-in data
        run: npm run data:${{ matrix.game }}
        env:
          DATA_MODE: reuse
      - name: Merge saved observations without replacing richer history
        run: |
          if [ -d .market-recovery ]; then
            node scripts/tools/merge-pages-artifact.mjs .market-recovery
          fi
      - name: Validate recovery baseline
        run: npm run validate:${{ matrix.game }}
      # Fetchers stage changes and promote only after their publication gates.
      # A failed refresh therefore leaves the validated recovery baseline intact.
      - name: Fetch fresh market data
        id: refresh
        if: github.event_name != 'push'
        continue-on-error: true
        run: npm run data:${{ matrix.game }}
        env:
          DATA_MODE: fetch
      - name: Validate publishable data
        run: npm run validate:${{ matrix.game }}
      - name: Select backup retention
        id: retention
        run: |
          days=3
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "$(date -u +%H)" = "00" ]; then
            days=30
          fi
          echo "days=$days" >> "$GITHUB_OUTPUT"
      # Save before build/deploy, even when this game had to retain old prices.
      - name: Retain validated game data
        uses: actions/upload-artifact@v4
        with:
          name: market-data-${{ matrix.game }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: public/data/${{ matrix.game }}
          retention-days: ${{ steps.retention.outputs.days }}
          if-no-files-found: error
      - name: Prepare next run's recovery seed
        run: |
          mkdir -p .market-recovery/${{ matrix.game }}
          cp -a public/data/${{ matrix.game }}/. .market-recovery/${{ matrix.game }}/
      - name: Save history independently of site deployment
        uses: actions/cache/save@v4
        with:
          path: .market-recovery
          key: market-history-v1-${{ matrix.game }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Report failed refresh after preserving valid data
        if: steps.refresh.outcome == 'failure'
        run: |
          echo "::error::${{ matrix.game }} refresh failed. Validated previous data was retained; inspect the refresh step."
          echo "${{ matrix.game }}: refresh failed; publishing retained data if site checks pass." >> "$GITHUB_STEP_SUMMARY"
          exit 1

  build:
    needs: [checks, snapshots]
    # A refresh failure is visible in Actions, but its validated fallback artifact
    # may still be deployed alongside the other game's successful update.
    if: ${{ !cancelled() && needs.checks.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: market-data-poe1-${{ github.run_id }}-${{ github.run_attempt }}
          path: public/data/poe1
      - uses: actions/download-artifact@v4
        with:
          name: market-data-poe2-${{ github.run_id }}-${{ github.run_attempt }}
          path: public/data/poe2
      - run: npm run validate
      - name: Validate generated file contracts
        run: node scripts/tests/shared/test-contracts.mjs
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
